logging:
  level:
    ru.yandex.practicum.analyzer: DEBUG

kafka:
  hubEventsConsumer:
    bootstrapServer: "localhost:9092"
    client_id: "client_01"
    group_id: "group_02"
    topic: "telemetry.hubs.v1"
    maxPollIntervalMs : 1000
    pollTimeoutMs: 100
    enableAutoCommit: "false"
  snapshotsConsumer:
    bootstrapServer: "localhost:9092"
    client_id: "client_01"
    group_id: "group_03"
    topic: "telemetry.snapshots.v1"
    maxPollIntervalMs: 1000
    pollTimeoutMs: 100
    enableAutoCommit: "false"
  producer:
    bootstrapServer: "localhost:9092"
    topic: "telemetry.test.v1"

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: always
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/analyzerdb
    username: analyzer
    password: analyzer

grpc:
  client:
    hubrouter:
      address: 'localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext